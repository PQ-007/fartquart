name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      # Generates public/resources + src/lib/resources-manifest.ts (gitignored),
      # which the typecheck depends on.
      - name: Sync vault resources
        run: npm run sync-resources

      - name: Typecheck
        run: npm run typecheck

      - name: Vault doctor (content lint)
        run: npm run doctor

      - name: Build
        run: npm run build
